# Компиляция MQL5-советников на Windows-раннере.
# Ставит MetaTrader 5 (portable), собирает оба EA, при ошибках — красный билд.
name: build-ea

on:
  push:
    branches: [main]
    paths: ["mt5_ea/**", ".github/workflows/build-ea.yml"]
  pull_request:
    paths: ["mt5_ea/**", ".github/workflows/build-ea.yml"]
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache MT5 installer
        uses: actions/cache@v4
        with:
          path: ~/mt5setup.exe
          key: mt5setup-2026

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:USERPROFILE\mt5setup.exe")) {
            Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "$env:USERPROFILE\mt5setup.exe"
          }

      - name: Install MetaTrader 5 (silent)
        shell: pwsh
        run: |
          Start-Process -FilePath "$env:USERPROFILE\mt5setup.exe" -ArgumentList "/auto" -Wait
          $ed = "C:\Program Files\MetaTrader 5\metaeditor64.exe"
          if (-not (Test-Path $ed)) { throw "MetaEditor не установился" }

      - name: Bootstrap terminal (first run populates MQL5 standard library)
        shell: pwsh
        run: |
          $pf = "C:\Program Files\MetaTrader 5\MQL5\Include\Trade\Trade.mqh"
          $ad = Get-ChildItem "$env:APPDATA\MetaQuotes\Terminal" -Directory -ErrorAction SilentlyContinue |
                ForEach-Object { Join-Path $_.FullName "MQL5\Include\Trade\Trade.mqh" } |
                Where-Object { Test-Path $_ } | Select-Object -First 1
          if ((Test-Path $pf) -or $ad) { Write-Host "библиотека уже на месте"; "MQL5DIR=auto" | Out-File $env:GITHUB_ENV -Append; exit 0 }
          Start-Process -FilePath "C:\Program Files\MetaTrader 5\terminal64.exe"
          $where = $null
          for ($i = 0; $i -lt 36; $i++) {
            Start-Sleep -Seconds 10
            if (Test-Path $pf) { $where = "pf"; break }
            $ad = Get-ChildItem "$env:APPDATA\MetaQuotes\Terminal" -Directory -ErrorAction SilentlyContinue |
                  ForEach-Object { Join-Path $_.FullName "MQL5\Include\Trade\Trade.mqh" } |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($ad) { $where = "appdata"; break }
          }
          Stop-Process -Name terminal64 -Force -ErrorAction SilentlyContinue
          if (-not $where) { throw "стандартная библиотека MQL5 не появилась за 360 с" }
          if ($where -eq "pf") { "MQL5DIR=C:\Program Files\MetaTrader 5\MQL5" | Out-File $env:GITHUB_ENV -Append }
          elseif ($ad) { "MQL5DIR=$(Split-Path (Split-Path $ad))" | Out-File $env:GITHUB_ENV -Append }
          Write-Host "библиотека найдена: $where"

      - name: Compile RangeBotEA and Ict2022EA
        shell: pwsh
        run: |
          $ed = "C:\Program Files\MetaTrader 5\metaeditor64.exe"
          $mql5dir = $env:MQL5DIR
          Write-Host "Include-путь: $mql5dir"
          $fail = 0
          foreach ($ea in @("RangeBotEA", "Ict2022EA", "ScreenshotEA")) {
            $src = "$env:GITHUB_WORKSPACE\mt5_ea\$ea.mq5"
            $log = "$env:GITHUB_WORKSPACE\mt5_ea\ci_$ea.log"
            $p = Start-Process -FilePath $ed -ArgumentList "/compile:`"$src`"", "/inc:`"$mql5dir`"", "/log:`"$log`"" -Wait -PassThru
            $text = Get-Content $log -ErrorAction SilentlyContinue
            $tail = ($text | Select-Object -Last 3) -join " "
            Write-Host "== $ea (exit $($p.ExitCode)): $tail"
            # exit code MetaEditor = количество файлов с ошибками; 0 ошибок в логе обязателен
            if ($p.ExitCode -ne 0 -or ($tail -notmatch "0 errors")) { $fail = 1 }
          }
          if ($fail) { throw "ошибки компиляции" }

      - name: Upload compiled EAs
        uses: actions/upload-artifact@v4
        with:
          name: ea-builds
          path: |
            mt5_ea/RangeBotEA.ex5
            mt5_ea/Ict2022EA.ex5
            mt5_ea/ScreenshotEA.ex5
          if-no-files-found: error
