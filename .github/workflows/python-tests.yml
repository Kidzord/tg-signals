name: python-tests

on:
  push:
    branches: [main]
    paths: ["**/*.py", "tests/**", "requirements*.txt", "ruff.toml", ".github/workflows/python-tests.yml"]
  pull_request:
    paths: ["**/*.py", "tests/**", "requirements*.txt", "ruff.toml", ".github/workflows/python-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.17.1
      - name: Lint (ruff F/E9)
        run: python -m ruff check .
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
